[project]
name = "neuro-air-lite"
version = "0.1.0"
description = "Neuro-Air Lite: hierarchical multi-agent air quality analyst for Hong Kong"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.60",
    "osmium>=4.3.2",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pytest>=8.3",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
# The agent loop is async, so every `async def test_*` needs the plugin to drive it.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
