[project]
name = "neuro-air-lite"
version = "0.1.0"
description = "Neuro-Air Lite: hierarchical multi-agent air quality analyst for Hong Kong"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.60",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "pytest>=8.3",
    "python-dotenv>=1.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "uvicorn[standard]>=0.32",
]
