services:
  db:
    image: postgis/postgis:16-3.4
    container_name: neuroair-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the admin env file and rerun with --env-file}"
      POSTGRES_DB: ${POSTGRES_DB:-airdb}
      TZ: Asia/Hong_Kong
      PGTZ: Asia/Hong_Kong
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airdb}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
