services:
  db:
    image: postgis/postgis:16-3.4
    container_name: neuroair-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the admin env file and rerun with --env-file}"
      POSTGRES_DB: ${POSTGRES_DB:-airdb}
      TZ: Asia/Hong_Kong
      PGTZ: Asia/Hong_Kong
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airdb}
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: .
    image: neuroair-api:day10
    container_name: neuroair-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RUNTIME_MODE: ${RUNTIME_MODE:-subprocess}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
      DB_URL_RO: "${DB_URL_RO_DOCKER:?set DB_URL_RO_DOCKER in .env with the db service hostname}"
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
